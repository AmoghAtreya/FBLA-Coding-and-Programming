<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" fill="none">
  <!-- iPhone Screen Background -->
  <rect width="375" height="812" fill="#F8FAFC"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#10B981"/>
  <text x="20" y="28" fill="white" font-family="Arial" font-size="14" font-weight="bold">9:41</text>
  <text x="325" y="28" fill="white" font-family="Arial" font-size="12">100%</text>
  
  <!-- Header -->
  <rect y="44" width="375" height="80" fill="#10B981"/>
  <text x="20" y="90" fill="white" font-family="Arial" font-size="24" font-weight="bold">FinFlow</text>
  <text x="20" y="110" fill="white" font-family="Arial" font-size="14" opacity="0.9">Good morning, Student!</text>
  
  <!-- Balance Card -->
  <rect x="20" y="140" width="335" height="120" rx="16" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="35" y="170" fill="#6B7280" font-family="Arial" font-size="14">Total Balance</text>
  <text x="35" y="200" fill="#1F2937" font-family="Arial" font-size="32" font-weight="bold">$3,247.80</text>
  <text x="35" y="225" fill="#10B981" font-family="Arial" font-size="14">+$124 this month</text>
  
  <!-- Quick Actions -->
  <text x="20" y="300" fill="#1F2937" font-family="Arial" font-size="18" font-weight="bold">Quick Actions</text>
  
  <!-- Action Buttons -->
  <rect x="20" y="320" width="100" height="80" rx="12" fill="#EFF6FF"/>
  <rect x="35" y="335" width="16" height="16" fill="#3B82F6"/>
  <text x="35" y="370" fill="#1F2937" font-family="Arial" font-size="12" font-weight="600">Add Income</text>
  <text x="35" y="385" fill="#6B7280" font-family="Arial" font-size="10">Track earnings</text>
  
  <rect x="137.5" y="320" width="100" height="80" rx="12" fill="#F0FDF4"/>
  <rect x="152.5" y="335" width="16" height="16" fill="#10B981"/>
  <text x="152.5" y="370" fill="#1F2937" font-family="Arial" font-size="12" font-weight="600">Add Expense</text>
  <text x="152.5" y="385" fill="#6B7280" font-family="Arial" font-size="10">Log spending</text>
  
  <rect x="255" y="320" width="100" height="80" rx="12" fill="#FEF3F2"/>
  <rect x="270" y="335" width="16" height="16" fill="#EF4444"/>
  <text x="270" y="370" fill="#1F2937" font-family="Arial" font-size="12" font-weight="600">Set Budget</text>
  <text x="270" y="385" fill="#6B7280" font-family="Arial" font-size="10">Plan ahead</text>
  
  <!-- Recent Transactions -->
  <text x="20" y="450" fill="#1F2937" font-family="Arial" font-size="18" font-weight="bold">Recent Transactions</text>
  
  <!-- Transaction Items -->
  <rect x="20" y="470" width="335" height="60" rx="8" fill="white"/>
  <circle cx="45" cy="500" r="16" fill="#10B981"/>
  <text x="75" y="495" fill="#1F2937" font-family="Arial" font-size="14" font-weight="600">Scholarship</text>
  <text x="75" y="510" fill="#6B7280" font-family="Arial" font-size="12">Today, 2:30 PM</text>
  <text x="320" y="500" fill="#10B981" font-family="Arial" font-size="14" font-weight="bold">+$500</text>
  
  <rect x="20" y="540" width="335" height="60" rx="8" fill="white"/>
  <circle cx="45" cy="570" r="16" fill="#EF4444"/>
  <text x="75" y="565" fill="#1F2937" font-family="Arial" font-size="14" font-weight="600">Textbooks</text>
  <text x="75" y="580" fill="#6B7280" font-family="Arial" font-size="12">Yesterday, 4:15 PM</text>
  <text x="320" y="570" fill="#EF4444" font-family="Arial" font-size="14" font-weight="bold">-$89</text>
  
  <rect x="20" y="610" width="335" height="60" rx="8" fill="white"/>
  <circle cx="45" cy="640" r="16" fill="#F59E0B"/>
  <text x="75" y="635" fill="#1F2937" font-family="Arial" font-size="14" font-weight="600">Lunch</text>
  <text x="75" y="650" fill="#6B7280" font-family="Arial" font-size="12">Yesterday, 12:45 PM</text>
  <text x="320" y="640" fill="#EF4444" font-family="Arial" font-size="14" font-weight="bold">-$12</text>
  
  <!-- Bottom Navigation -->
  <rect y="732" width="375" height="80" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="75" y="752" width="40" height="40" rx="8" fill="#10B981"/>
  <text x="87" y="775" fill="white" font-family="Arial" font-size="12" font-weight="bold">🏠</text>
  
  <rect x="167.5" y="752" width="40" height="40" rx="8" fill="#F3F4F6"/>
  <text x="179.5" y="775" fill="#6B7280" font-family="Arial" font-size="12">📊</text>
  
  <rect x="260" y="752" width="40" height="40" rx="8" fill="#F3F4F6"/>
</svg> 