<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" fill="none">
  <!-- iPhone Screen Background -->
  <rect width="375" height="812" fill="#111827"/>
  
  <!-- Status Bar -->
  <rect width="375" height="44" fill="#1F2937"/>
  <text x="20" y="28" fill="white" font-family="Arial" font-size="14" font-weight="bold">9:41</text>
  <text x="325" y="28" fill="white" font-family="Arial" font-size="12">100%</text>
  
  <!-- Header -->
  <rect y="44" width="375" height="80" fill="#1F2937"/>
  <text x="20" y="90" fill="white" font-family="Arial" font-size="24" font-weight="bold">FinFlow</text>
  <text x="20" y="110" fill="#9CA3AF" font-family="Arial" font-size="14">Portfolio Overview</text>
  
  <!-- Balance Card -->
  <rect x="20" y="140" width="335" height="120" rx="16" fill="#1F2937" stroke="#374151" stroke-width="1"/>
